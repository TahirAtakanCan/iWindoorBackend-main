spring.application.name=iWindoor Backend

# --- Veritabanı (yerel geliştirme varsayılanları; canlıda ortam değişkenleri) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/windoor_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:123456789}

# --- Şema: Flyway yönetir, Hibernate sadece doğrular ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway öncesinden kalan veritabanı: mevcut şema V1 kabul edilir, V2'den devam edilir
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- JWT (yerel geliştirme anahtarı; canlıda JWT_SECRET zorunlu, bkz. application-prod.properties) ---
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:10}

# Hata yanıtlarında yığın izi gösterme
server.error.include-stacktrace=never
